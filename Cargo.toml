[package]
name = "augur"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Context-aware inline command suggestions for bash, via ble.sh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hvpaiva/augur"
readme = "README.md"
keywords = ["bash", "blesh", "shell", "autosuggestion", "completion"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
